<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Java Console</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #21252c;
    --border: #343a45;
    --text: #e4e7eb;
    --muted: #8b93a1;
    --accent: #4fd1c5;
    --error: #e5484d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    line-height: 1.5;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: var(--text);
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 32px 0;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px;
    border-radius: 4px;
    resize: vertical;
    min-height: 100px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }

  input[type="file"] {
    font-size: 13px;
    color: var(--muted);
    max-width: 100%;
  }

  #fileName {
    font-size: 13px;
    color: var(--accent);
  }

  button {
    margin-top: 20px;
    background: var(--accent);
    color: #0f1215;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #output {
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  #output .label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #response {
    white-space: pre-wrap;
    font-size: 14px;
    color: var(--text);
  }

  #response.error {
    color: var(--error);
  }

  #response.empty {
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Claude Java Console</h1>
  <p class="subtitle">A message and/or a file, sent straight to the Claude API through a Java backend.</p>

  <label for="message">Message</label>
  <textarea id="message" placeholder="Ask something, or leave blank and just attach a file..."></textarea>

  <div class="file-row">
    <input type="file" id="fileInput" accept=".txt,.md,.java,.csv,.log">
    <span id="fileName"></span>
  </div>

  <button id="sendBtn">Send</button>

  <div id="output">
    <div class="label">Response</div>
    <div id="response" class="empty">Nothing sent yet.</div>
  </div>
</main>

<script>
  const messageInput = document.getElementById('message');
  const fileInput = document.getElementById('fileInput');
  const fileNameLabel = document.getElementById('fileName');
  const sendBtn = document.getElementById('sendBtn');
  const responseBox = document.getElementById('response');

  fileInput.addEventListener('change', () => {
    fileNameLabel.textContent = fileInput.files.length > 0 ? fileInput.files[0].name : '';
  });

  sendBtn.addEventListener('click', async () => {
    const message = messageInput.value.trim();
    let fileContent = '';

    if (fileInput.files.length > 0) {
      try {
        fileContent = await fileInput.files[0].text();
      } catch (err) {
        setResponse('Could not read the attached file: ' + err, true);
        return;
      }
    }

    if (!message && !fileContent) {
      setResponse('Type a message or attach a file first.', true);
      return;
    }

    sendBtn.disabled = true;
    setResponse('Thinking...', false);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, fileContent })
      });
      const data = await res.json();
      setResponse(data.reply || '(empty response)', !res.ok);
    } catch (err) {
      setResponse('Request failed: ' + err, true);
    } finally {
      sendBtn.disabled = false;
    }
  });

  function setResponse(text, isError) {
    responseBox.textContent = text;
    responseBox.classList.toggle('error', !!isError);
    responseBox.classList.remove('empty');
  }
</script>
</body>
</html>
